name: Verify before release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: windows-native-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Run native login, sync and request regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked -- --test-threads=1 --nocapture
      - name: Build diagnostic binary without publishing a release
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Load the Widevine module
        shell: bash
        run: src-tauri/target/release/spotify.exe --widevine-probe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verified-binary
          path: src-tauri/target/release/spotify.exe

  # the same compile the release does on macOS and Linux, so a platform-only
  # break shows up here instead of in a half-built release
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # the signed .app the release ships, not a bare cargo build: signing (hardened
      # runtime + Entitlements.plist) decides whether the Widevine module may load
      - name: Build and sign the app bundle
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Check the bundle's signature and entitlements
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Musique.app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" > entitlements.txt 2>&1 || true
          cat entitlements.txt
          grep -q com.apple.security.cs.disable-library-validation entitlements.txt
      - name: Load the Widevine module in the signed app
        # the runners are Apple Silicon; the Intel build is checked for its entitlements above
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Musique.app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          "$app/Contents/MacOS/$exe" --widevine-probe
          # control: the same app signed without the entitlements must be refused, or the
          # probe above is not exercising library validation. GitHub's runners ship with SIP
          # off, which turns library validation off too, so the control only means
          # something where SIP is on.
          csrutil status || true
          if ! csrutil status 2>/dev/null | grep -q enabled; then
            echo "::notice::SIP is off on this runner, so library validation is not enforced; the entitlements are checked above, the refusal control is skipped"
            exit 0
          fi
          cp -R "$app" "$RUNNER_TEMP/control.app"
          codesign --force --sign - --options runtime "$RUNNER_TEMP/control.app"
          if "$RUNNER_TEMP/control.app/Contents/MacOS/$exe" --widevine-probe > control.txt 2>&1; then
            cat control.txt; echo "control loaded the module without the entitlements"; exit 1
          fi
          cat control.txt
          grep -q "Team ID" control.txt

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Run the regression tests the release runs
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked -- --test-threads=1
      - run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Load the Widevine module
        run: src-tauri/target/release/spotify --widevine-probe
